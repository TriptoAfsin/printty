name: Release

# A v* tag (for example v0.1.0) builds every download and publishes a GitHub
# release with notes from CHANGELOG.md. Run it by hand to build the downloads
# as workflow artifacts only (a dry run), without touching releases.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  # Windows: printty.exe for x64 and Arm, each as an installer (sets up the
  # service, tray icon and Start menu entry) and as a portable zip.
  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go vet ./...
          go test ./...
      - name: Icon and version details for printty.exe
        shell: bash
        # Windows file versions are numbers only: 0.2.0-rc.1 becomes 0.2.0.
        # Retried: it downloads go-winres, and the module proxy sometimes drops a connection.
        run: |
          for i in 1 2 3; do
            bash tools/winres.sh "${VERSION%%-*}" && exit 0
            echo "Retrying in 15 s"; sleep 15
          done
          exit 1
      - name: Build
        shell: bash
        run: |
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o dist/windows-$arch/printty.exe ./cmd/printty
          done
      - name: Installers
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          foreach ($a in @(@{go='amd64'; inno='x64'}, @{go='arm64'; inno='arm64'})) {
            & $iscc "/DAppVersion=$env:VERSION" "/DArch=$($a.inno)" "/DSourceDir=..\..\dist\windows-$($a.go)" packaging\windows\printty.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Portable zips
        shell: pwsh
        run: |
          foreach ($a in @(@{go='amd64'; name='x64'}, @{go='arm64'; name='arm64'})) {
            $dir = "dist\windows-$($a.go)"
            Copy-Item printty.env.example, README.md $dir
            Compress-Archive -Path "$dir\*" -DestinationPath "dist\Printty_${env:VERSION}_windows_$($a.name)_portable.zip"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*_setup.exe
            dist/*.zip
          if-no-files-found: error

  # Linux and macOS: one static binary each (CUPS does the printing), packed
  # with tar on Linux so the executable bit survives.
  # Linux: archives with install.sh, .deb and .rpm (systemd service, CUPS
  # dependency) for x86_64 and Arm, and an AppImage (x86_64). macOS archives
  # are built here too; the .dmg needs a Mac (job below).
  unix:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go vet ./...
          go test ./...
      - name: Build and pack archives
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}
            name="Printty_${VERSION}_${os}_${arch}"
            mkdir -p "dist/$name" "dist/$os-$arch"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$os-$arch/printty" ./cmd/printty
            cp "dist/$os-$arch/printty" printty.env.example README.md "dist/$name/"
            if [ "$os" = linux ]; then cp packaging/linux/printty.service packaging/linux/install.sh "dist/$name/"; fi
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
      - name: .deb and .rpm
        run: |
          sed 's|/usr/local/bin/printty|/usr/bin/printty|' packaging/linux/printty.service > dist/printty-pkg.service
          # Package versions can't contain "-": 0.3.0-rc.1 becomes 0.3.0~rc.1.
          PKGV=$(echo "$VERSION" | tr '-' '~')
          for arch in amd64 arm64; do
            mkdir -p dist/pkg && cp "dist/linux-$arch/printty" dist/pkg/printty
            for f in deb rpm; do
              VERSION=$PKGV ARCH=$arch go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0 package -f packaging/linux/nfpm.yaml -p $f -t dist/
            done
          done
          # Predictable names, like the other downloads.
          for f in dist/*.deb dist/*.rpm; do
            case "$f" in
              *amd64.deb|*x86_64.rpm) a=amd64 ;;
              *) a=arm64 ;;
            esac
            mv "$f" "dist/Printty_${VERSION}_linux_${a}.${f##*.}"
          done
      - name: AppImage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfuse2 >/dev/null
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          app=dist/Printty.AppDir
          mkdir -p "$app/usr/bin"
          cp dist/linux-amd64/printty "$app/usr/bin/printty"
          cp packaging/appimage/AppRun packaging/appimage/printty.desktop "$app/"
          cp internal/web/static/icon-512.png "$app/printty.png"
          ARCH=x86_64 ./appimagetool --no-appstream "$app" "dist/Printty_${VERSION}_linux_x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: unix
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  # macOS: Printty.app (one binary for Apple silicon and Intel) in a .dmg.
  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the app
        run: |
          for arch in amd64 arm64; do
            GOOS=darwin GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/printty-$arch" ./cmd/printty
          done
          app=dist/dmg/Printty.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          lipo -create -output "$app/MacOS/printty-server" dist/printty-amd64 dist/printty-arm64
          cp packaging/macos/launcher.sh "$app/MacOS/Printty"
          chmod +x "$app/MacOS/Printty" "$app/MacOS/printty-server"
          sed "s/__VERSION__/${VERSION%%-*}/g" packaging/macos/Info.plist > "$app/Info.plist"
          set=dist/printty.iconset
          mkdir -p "$set"
          for s in 16 32 128 256 512; do
            sips -z $s $s internal/web/static/icon-512.png --out "$set/icon_${s}x${s}.png" >/dev/null
            d=$((s*2)); [ $d -le 512 ] && sips -z $d $d internal/web/static/icon-512.png --out "$set/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$set" -o "$app/Resources/printty.icns"
          ln -s /Applications dist/dmg/Applications
          # The app must hold both architectures of the real program.
          lipo -info "$app/MacOS/printty-server" | grep -q "x86_64 arm64"
          "$app/MacOS/printty-server" -version
      - name: Disk image
        run: hdiutil create -volname Printty -srcfolder dist/dmg -ov -format UDZO "dist/Printty_${VERSION}_macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    needs: [version, windows, unix, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: |
          NOTES=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d')
          [ -n "$NOTES" ] || NOTES="See CHANGELOG.md."
          V=$VERSION
          cat > body.md <<NOTES_EOF
          $NOTES

          ## Install

          | System | Download |
          |---|---|
          | **Windows** (Intel, AMD) | \`Printty_${V}_x64_setup.exe\`: installs Printty as a service that starts with Windows, adds the tray icon and opens the setup page. Windows asks for administrator permission once. |
          | Windows on Arm | \`Printty_${V}_arm64_setup.exe\` |
          | Windows, no install | \`Printty_${V}_windows_x64_portable.zip\`: unzip and run \`printty.exe\`; install the service later from Settings. |
          | **Linux**: Debian, Ubuntu, Raspberry Pi OS | \`Printty_${V}_linux_amd64.deb\` (or \`_arm64\`): \`sudo apt install ./Printty_${V}_linux_amd64.deb\`. Installs a systemd service and the CUPS client. |
          | **Linux**: Fedora, openSUSE | \`Printty_${V}_linux_amd64.rpm\` (or \`_arm64\`): \`sudo dnf install ./Printty_${V}_linux_amd64.rpm\` |
          | Linux, any distribution | \`Printty_${V}_linux_x86_64.AppImage\`: make it executable and run it; Printty runs while it's open. Or the \`.tar.gz\`: unpack and run \`sudo ./install.sh\`. |
          | **macOS** (Apple silicon and Intel) | \`Printty_${V}_macos.dmg\`: drag Printty to Applications and open it; Printty runs while the app is open. Not yet tested on a Mac. |
          | macOS, command line | \`Printty_${V}_darwin_arm64.tar.gz\` or \`_amd64\` |

          After installing, open the page on the PC itself (the Start menu entry **Printty** does that): the setup code is filled in, and you create the owner account. Phones on the same Wi-Fi then use the address shown under **Open on phones**.

          ## Unsigned builds
          These downloads aren't code-signed. Windows SmartScreen may say "Windows protected your PC": choose **More info**, then **Run anyway**. On macOS, if Printty "is damaged" or "can't be opened", run \`xattr -cr /Applications/Printty.app\` once in Terminal. Linux packages are tested installing and removing; the macOS app and the AppImage are new and not yet tested on real machines. Check any download against \`SHA256SUMS.txt\`.
          NOTES_EOF
          cat body.md
      - name: Publish
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" out/* --title "Printty $VERSION" --notes-file body.md $pre
